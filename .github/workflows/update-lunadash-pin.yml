name: Update LunaDash pin

# Every push to main pins it in LunaDash: packaging/slintlu-revision on LunaDash's dev
# branch is set to this repository's main and committed there, so the next
# LunaDash build uses it. Needs the LUNADASH_PIN_TOKEN secret: a fine-grained
# token with Contents read and write on LuYishan-4/LunaDash.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One update at a time, in push order.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  pin:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check for the token
        env:
          TOKEN: ${{ secrets.LUNADASH_PIN_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Add the LUNADASH_PIN_TOKEN secret (Contents read and write on LuYishan-4/LunaDash)."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          repository: LuYishan-4/LunaDash
          ref: dev
          token: ${{ secrets.LUNADASH_PIN_TOKEN }}
          # Kept so the pin commit can be pushed back.
          persist-credentials: true
      - name: Pin SlintLu main on LunaDash dev
        env:
          PIN_FILE: packaging/slintlu-revision
        run: |
          set -euo pipefail
          # The head of main now, not the pushed commit: a run that waited
          # behind a newer push must not pin an older revision.
          revision=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)
          test "${#revision}" -eq 40
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --quiet origin dev
            git reset --quiet --hard origin/dev
            if [ "$(cat "$PIN_FILE")" = "$revision" ]; then
              echo "LunaDash dev already pins SlintLu $revision."
              exit 0
            fi
            printf '%s\n' "$revision" > "$PIN_FILE"
            # The pin must be fetchable the way LunaDash builds fetch it.
            rm -rf "$RUNNER_TEMP/SlintLu"
            bash scripts/fetch-slintlu.sh "$RUNNER_TEMP/SlintLu"
            git commit --quiet -m "chore(packaging): pin SlintLu ${revision:0:7}" -- "$PIN_FILE"
            if git push --quiet origin HEAD:dev; then
              echo "Pinned SlintLu $revision on LunaDash dev."
              exit 0
            fi
            echo "LunaDash dev moved meanwhile; retrying."
          done
          echo "::error::LunaDash dev kept moving; the pin was not pushed."
          exit 1
